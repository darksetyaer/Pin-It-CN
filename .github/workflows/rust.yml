name: Build Rust installer

# Run this workflow from the Actions tab when you want a Windows installer
# and a portable ZIP without adding another automatic build for every push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Test
        working-directory: rust
        run: cargo test --locked

      - name: Build release executable
        working-directory: rust
        run: cargo build --release --locked

      - name: Stage executable
        run: |
          New-Item -ItemType Directory -Force -Path dist\PinIt | Out-Null
          Copy-Item rust\target\release\pinit.exe dist\PinIt\PinIt.exe
          (Get-Item dist\PinIt\PinIt.exe).VersionInfo |
            Format-List FileVersion, ProductVersion

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PinIt.iss

      - name: Make portable ZIP
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive `
            -Path dist\PinIt\* `
            -DestinationPath release\PinIt-portable-x64.zip `
            -Force

      - name: Write checksums
        run: |
          $lines = Get-ChildItem release -File |
            ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
            }
          [IO.File]::WriteAllText(
            "$PWD\release\SHA256SUMS.txt",
            (($lines -join "`n") + "`n")
          )
          Get-Content release\SHA256SUMS.txt

      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PinIt-windows
          path: release\*
          if-no-files-found: error
